<li class="todo-item" [class.completed]="todo().completed">
    <label>
        <input type="checkbox" [checked]="todo().completed" (change)="todosToggled.emit(todo().id)"/>
        <span>{{ todo().title }}</span>
    </label>
    <button type="button" [attr.aria-label]="'Excluir a tarefa ' + todo().title" (click)="todosRemoved.emit(todo().id)">
        Excluir
    </button>
</li>
