@if (todos().length === 0) {
    <p class="empty-message">Nenhuma tarefa cadastrada.</p>
} @else {
    <ul class="todo-list">
        @for (todo of todos(); track todo.id) {
        <app-todo-item
            [todo]="todo"
            (todosToggled)="todosToggled.emit($event)"
            (todosRemoved)="todosRemoved.emit($event)" />
        }
    </ul>
}
