<main class="page">
  <section class="todo-card">
    <header>
      <p class="eyebrow">Angular</p>
      <h1>Lista de tarefas</h1>
      <p>Organize suas atividades e mantenha os dados salvos no navegador.</p>
    </header>

    <app-todo-form (todoAdded)="store.add($event)" />

    <app-todo-list
      [todos]="store.todos()"
      (todoToggled)="store.toggle($event)"
      {todoRemoved}="store.removed($event)"
    />

  </section>
</main>
